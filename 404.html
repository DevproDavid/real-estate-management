<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var currentPath = location.pathname + location.search + location.hash;
      var repoName = "/real-estate-management";

      if (currentPath.startsWith(repoName)) {
        currentPath = currentPath.replace(repoName, '');
      }

      // Redirect to the app with the original path in hash
      window.location.replace(repoName + "/index.html#"+ currentPath);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
